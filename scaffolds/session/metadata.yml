# {{RUTA_SESION}}/metadata.yml — registro de la sesión {{NUMBER}} de {{COURSE_ID}}
# Fuente única de información de la sesión (NORMATIVA_ARCHIVOS §7: núcleo id · titulo · estado).
# Los scripts (validate.sh, stats.sh) leen los campos marcados [script]; el número lo da la carpeta SNN.

# --- Identificación ------------------------------- [script]
id: {{SLUG}}
titulo: "{{TITLE}}"
unidad: 1
semana: {{NUMBER}}
fecha: null                # YYYY-MM-DD cuando se programe

# --- Logística ------------------------------------ [script]
duracion_minutos: {{DURATION}}
modalidad: {{MODALITY}}
nivel: {{LEVEL}}
formato_slides: {{FORMAT}}   # latex-beamer | quarto-revealjs
estado: borrador             # borrador | activo | hecho (ciclo de vida §2.1)

# --- Diseño instruccional --------------------------------
competencias:
  - ""
capacidades:
  - ""
resultados_aprendizaje:
  - ""
indicadores:
  - ""
conocimientos_previos:
  - ""

# --- Recursos ---------------------------------------------
material_requerido:
  - "Proyector"
  - "Pizarra y plumones"
software:
  - ""

# --- Evaluación -------------------------------------------
evaluacion: ""             # instrumento principal (quiz, rúbrica, etc.)

