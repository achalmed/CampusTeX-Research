# estadistica/temario.yml — mapa de los temas del laboratorio de estadística: id, título, estado y temas de curso.yml que cubre.
# Reconstruido el 2026-10-01 (E1, meta/diagnosticos/DIAGNOSTICO_SIMULADORES_2026-10.md): la lista original de 239 temas no se
# versionó. estado: hecho = hay modelo · anclado = un modelo ya escrito cita ese número con ese significado (ancla) ·
# propuesto = reconstrucción por aprobar. Los temas e240+ cubren lo que pide estadistica-para-economistas (S7).
# El currículo de un curso sigue en su curso.yml; aquí solo se dice qué tema del curso ilustra cada modelo.
tipo: temario_laboratorio
disciplina: estadistica
secciones:
  - nivel: 1
    nombre: "I · Fundamentos: datos y medición"
    temas:
      - {id: e01, titulo: "¿Qué es la estadística? Descriptiva, inferencial y su lugar en la economía", estado: propuesto, cursos: [{curso: estadistica, tema: '1.1'}, {curso: estadistica, tema: '1.2'}, {curso: estadistica-para-economistas, tema: '1.1'}, {curso: estadistica-para-economistas, tema: '1.5'}]}
      - {id: e02, titulo: "Población y muestra", estado: hecho, modelo: e02_poblacion_muestra, cursos: [{curso: estadistica, tema: '1.3'}]}
      - {id: e03, titulo: "Unidad de observación, variable y dato", estado: propuesto}
      - {id: e04, titulo: "Tipos de variables: cualitativas y cuantitativas, discretas y continuas", estado: propuesto, cursos: [{curso: estadistica, tema: '1.4'}]}
      - {id: e05, titulo: "Escalas de medición: nominal, ordinal, de intervalo y de razón", estado: propuesto, cursos: [{curso: estadistica, tema: '1.5'}]}
      - {id: e06, titulo: "Estadística descriptiva e inferencial", estado: propuesto, cursos: [{curso: estadistica, tema: '1.6'}]}
      - {id: e07, titulo: "Parámetro y estadístico", estado: propuesto}
      - {id: e08, titulo: "Fuentes de datos: censos, encuestas y registros administrativos", estado: propuesto, cursos: [{curso: estadistica-para-economistas, tema: '1.3'}]}
      - {id: e09, titulo: "Tipos de datos: corte transversal, series de tiempo y panel", estado: propuesto, cursos: [{curso: estadistica-para-economistas, tema: '1.2'}, {curso: estadistica-para-economistas, tema: '1.4'}]}
      - {id: e10, titulo: "Datos observacionales y experimentales", estado: propuesto}
      - {id: e11, titulo: "Error de medición: validez y confiabilidad", estado: propuesto}
      - {id: e12, titulo: "Distribución de frecuencias", estado: propuesto, cursos: [{curso: estadistica, tema: '2.1'}]}
      - {id: e13, titulo: "Tablas de frecuencia: absoluta, relativa y acumulada", estado: propuesto, cursos: [{curso: estadistica, tema: '2.2'}]}
      - {id: e14, titulo: "Histograma y polígono de frecuencias (ancho de clase, Sturges)", estado: propuesto, cursos: [{curso: estadistica, tema: '2.3'}]}
      - {id: e15, titulo: "Gráficos estadísticos: barras, sectores, caja y dispersión", estado: propuesto, cursos: [{curso: estadistica, tema: '2.4'}]}
      - {id: e16, titulo: "Datos agrupados y no agrupados", estado: propuesto}
